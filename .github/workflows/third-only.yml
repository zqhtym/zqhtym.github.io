name: Run third.py Only

on:
  workflow_dispatch:
    inputs:
      skip_drop_check:
        description: '跳过结果骤降检查（确认是正常变化时才勾选）'
        type: boolean
        default: false
  push:
    branches: [ main, master ]
    paths:
      - 'third.py'
      - 'utils/step_io.py'
      - 'utils/name_rules.py'
      - 'white.txt'
      - 'requirements.txt'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'third.py'
      - 'utils/step_io.py'
      - 'utils/name_rules.py'
      - 'white.txt'
      - 'requirements.txt'
  schedule:
    - cron: '0 4 * * *'  # 每天04:00 UTC

jobs:
  run-third:
    name: Run third.py (Step7-Step8)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SKIP_DROP_CHECK: ${{ inputs.skip_drop_check }}
      HAS_LX_KEY: ${{ secrets.LX_DEPLOY_KEY != '' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        # Install minimal required packages for OpenCV
        sudo apt-get install -y libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1
        
    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Verify ffmpeg installation
      run: |
        echo "🔍 检查ffmpeg安装位置"
        which ffmpeg || echo "ffmpeg不在PATH中"
        ffmpeg -version || echo "ffmpeg版本检查失败"
        
    - name: Ensure output directory exists
      run: |
        echo "📁 创建output目录"
        mkdir -p output/
        
    - name: Verify Step6 part files exist
      run: |
        echo "🔍 检查 Step6 各部分文件（由 second-part1.yml / second-part2.yml 生成）"
        ls -la output/step6_part*.csv || echo "❌ 未找到 output/step6_part*.csv"
        
    - name: Run third.py (Step7-Step8)
      run: |
        # 优化GitHub Actions环境性能
        export GITHUB_ACTIONS=true
        ulimit -v 2097152
        ulimit -t 3600
        ulimit -m 1048576
        ulimit -s 8192
        
        export PYTHONOPTIMIZE=2
        export PYTHONHASHSEED=0
        export MALLOC_TRIM_THRESHOLD_=30000
        export PYTHONMALLOC=malloc
        
        python -c "import gc; gc.set_threshold(400, 4, 4); gc.collect()"
        
        python third.py
        
    - name: Upload Step7-8 results
      uses: actions/upload-artifact@v4
      with:
        name: third-results
        path: |
          output/
          !output/LX.*
        retention-days: 7
      if: always()
        
    - name: Commit final CSV files to repository
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      run: |
        echo "🔍 检查output目录内容"
        ls -la output/ || echo "output目录不存在"
        
        echo "🔍 检查最终文件"
        find output/ -name "*.csv" -type f || echo "未找到最终CSV文件"
        find output/ -name "LE.txt" -o -name "LU.txt" -o -name "LE.m3u" -o -name "LU.m3u" || echo "未找到最终结果文件"
        
        echo "🔧 配置Git"
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        echo "📦 添加最终文件到Git"
        git add output/*.csv output/LE.txt output/LU.txt output/LE.m3u output/LU.m3u || echo "添加最终文件失败"
        
        echo "🔍 检查Git状态"
        git status
        
        echo "📝 提交更改"
        if git diff --staged --quiet; then
          echo "没有变化，无需提交"
          exit 0
        fi
        git commit -m "Auto update third.py final CSV - $(date '+%Y-%m-%d %H:%M:%S')"

        # 结果文件整份以本次运行为准：逐行合并会冲突，或者混入另一次运行的旧结果
        git config --local merge.this-run.driver 'cp -f %B %A'
        echo 'output/* merge=this-run' >> .git/info/attributes

        # 其他工作流可能在这期间推送了新提交，先 rebase 再推送，最多重试 3 次
        for i in 1 2 3; do
          if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "✅ 推送成功"
            exit 0
          fi
          git rebase --abort 2>/dev/null || true
          echo "⚠️ 推送失败，10 秒后重试 (${i}/3)"
          sleep 10
        done
        echo "❌ 推送失败"
        exit 1

    # LX（成人内容）推送到私有仓库 zqhtym/translate，需要在本仓库配置 LX_DEPLOY_KEY
    # （translate 仓库里一个有写权限的 Deploy Key 的私钥）
    - name: Check LX deploy key
      if: github.ref == 'refs/heads/main' && env.HAS_LX_KEY != 'true'
      run: echo "::warning::未配置 LX_DEPLOY_KEY，跳过推送 LX"

    - name: Checkout LX target repository
      if: github.ref == 'refs/heads/main' && env.HAS_LX_KEY == 'true'
      uses: actions/checkout@v4
      with:
        repository: zqhtym/translate
        ssh-key: ${{ secrets.LX_DEPLOY_KEY }}
        path: lx-target
        sparse-checkout: |
          /LX.txt
          /LX.m3u
        sparse-checkout-cone-mode: false

    - name: Push LX playlists
      if: github.ref == 'refs/heads/main' && env.HAS_LX_KEY == 'true'
      run: |
        if [ ! -f output/LX.txt ] || [ ! -f output/LX.m3u ]; then
          echo "本次没有生成 LX，跳过"
          exit 0
        fi
        cp output/LX.txt output/LX.m3u lx-target/
        cd lx-target
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        # translate 的 .gitignore 默认忽略所有文件，要加 -f
        git add -f --sparse LX.txt LX.m3u
        if git diff --staged --quiet; then
          echo "LX 没有变化，无需提交"
          exit 0
        fi
        git commit -m "自动更新 LX 播放列表 - $(date '+%Y-%m-%d %H:%M:%S')"
        # 同上：整份以本次运行为准
        git config --local merge.this-run.driver 'cp -f %B %A'
        echo '/LX.* merge=this-run' >> .git/info/attributes
        for i in 1 2 3; do
          if git pull --rebase origin main && git push origin HEAD:main; then
            echo "✅ LX 推送成功"
            exit 0
          fi
          git rebase --abort 2>/dev/null || true
          echo "⚠️ LX 推送失败，10 秒后重试 (${i}/3)"
          sleep 10
        done
        echo "❌ LX 推送失败"
        exit 1
