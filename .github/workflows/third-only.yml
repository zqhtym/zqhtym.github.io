name: Run third.py Only

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'third.py'
      - 'iptv_checker.py'
      - 'requirements.txt'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'third.py'
      - 'iptv_checker.py'
      - 'requirements.txt'
  schedule:
    - cron: '0 4 * * *'  # 每天04:00 UTC

jobs:
  run-third:
    name: Run third.py (Step7-Step8)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        # Install minimal required packages for OpenCV
        sudo apt-get install -y libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1
        
    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Verify ffmpeg installation
      run: |
        echo "🔍 检查ffmpeg安装位置"
        which ffmpeg || echo "ffmpeg不在PATH中"
        ffmpeg -version || echo "ffmpeg版本检查失败"
        
    - name: Ensure output directory exists
      run: |
        echo "📁 创建output目录"
        mkdir -p output/
        
    - name: Verify step6_video_resources.csv exists
      run: |
        echo "🔍 检查step6_video_resources.csv文件"
        if [ -f "output/step6_video_resources.csv" ]; then
          echo "✅ step6_video_resources.csv存在"
          ls -la output/step6_video_resources.csv
        else
          echo "❌ step6_video_resources.csv不存在，从Git中检出"
          # 确保文件存在，如果不在output目录，可能需要从Git中获取
          find . -name "step6_video_resources.csv" -type f 2>/dev/null || echo "在仓库中未找到step6_video_resources.csv"
        fi
        
    - name: Run third.py (Step7-Step8)
      run: |
        # 优化GitHub Actions环境性能
        export GITHUB_ACTIONS=true
        ulimit -v 2097152
        ulimit -t 3600
        ulimit -m 1048576
        ulimit -s 8192
        
        export PYTHONOPTIMIZE=2
        export PYTHONHASHSEED=0
        export MALLOC_TRIM_THRESHOLD_=30000
        export PYTHONMALLOC=malloc
        
        python -c "import gc; gc.set_threshold(400, 4, 4); gc.collect()"
        
        python third.py
        
    - name: Upload Step7-8 results
      uses: actions/upload-artifact@v4
      with:
        name: third-results
        path: |
          output/
        retention-days: 7
      if: always()
        
    - name: Commit final CSV files to repository
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      run: |
        echo "🔍 检查output目录内容"
        ls -la output/ || echo "output目录不存在"
        
        echo "🔍 检查最终CSV文件"
        find output/ -name "*.csv" -type f || echo "未找到最终CSV文件"
        
        echo "🔧 配置Git"
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        echo "📦 添加最终CSV文件到Git"
        git add output/*.csv || echo "添加最终CSV文件失败"
        
        echo "🔍 检查Git状态"
        git status
        
        echo "📝 提交更改"
        git diff --staged --quiet || git commit -m "Auto update third.py final CSV - $(date '+%Y-%m-%d %H:%M:%S')"
        
        echo "🚀 推送到仓库"
        git push || echo "推送失败"
