name: IPTV直播流检�?
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # 每天北京时间 8:00 运行
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代�?      uses: actions/checkout@v4
      
    - name: 设置Python环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: 安装系统依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        ffmpeg -version
        
    - name: 安装Python依赖
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: 运行直播流检�?      run: |
        # 设置资源限制（基于IPTV API成功经验�?        ulimit -v 2097152  # 限制虚拟内存�?GB
        ulimit -t 3600     # 限制CPU时间�?小时
        ulimit -m 1048576  # 限制常驻内存�?GB
        ulimit -s 8192     # 限制栈大小为8MB
        
        # 设置Python优化参数
        export PYTHONOPTIMIZE=2
        export PYTHONHASHSEED=0
        export MALLOC_TRIM_THRESHOLD_=30000
        export PYTHONMALLOC=malloc
        
        # 设置垃圾回收
        python -c "import gc; gc.set_threshold(400, 4, 4); gc.collect()"
        
        # 运行基于IPTV API框架的检测程�?        python main.py
        
    - name: 处理输出文件
      run: |
        echo "=== 查找生成的文�?==="
        find . -name "live+*.txt" -newer main.py 2>/dev/null || true
        find . -name "*.m3u" -newer main.py 2>/dev/null || true
        
        # 查找output目录中的文件
        if [ -d "output" ]; then
          echo "=== output目录文件 ==="
          ls -la output/
          
          # 复制文件到根目录（保持兼容性）
          EXCELLENT_FILE=$(find output -name "live+excellent+*.txt" | head -1 || echo "")
          WONDERFUL_FILE=$(find output -name "live+wonderful+*.txt" | head -1 || echo "")
          GOOD_FILE=$(find output -name "live+good+*.txt" | head -1 || echo "")
          USEFUL_FILE=$(find output -name "live+useful+*.txt" | head -1 || echo "")
          
          if [ -n "$EXCELLENT_FILE" ]; then
            echo "找到excellent文件: $EXCELLENT_FILE"
            cp "$EXCELLENT_FILE" LE.txt
          fi
          
          if [ -n "$WONDERFUL_FILE" ]; then
            echo "找到wonderful文件: $WONDERFUL_FILE"
            cp "$WONDERFUL_FILE" LW.txt
          fi
          
          if [ -n "$GOOD_FILE" ]; then
            echo "找到good文件: $GOOD_FILE"
            cp "$GOOD_FILE" LG.txt
          fi
          
          if [ -n "$USEFUL_FILE" ]; then
            echo "找到useful文件: $USEFUL_FILE"
            cp "$USEFUL_FILE" LU.txt
          fi
        else
          echo "output目录不存�?
        fi
        
        # 列出最终文�?        echo "=== 最终文件列�?==="
        ls -la *.txt *.m3u 2>/dev/null || echo "无txt或m3u文件"
        
    - name: 部署到GitHub Pages
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add LE.txt LU.txt LE.m3u LU.m3u live+*.txt 2>/dev/null || true
        git commit -m "自动更新直播流列�?- $(date '+%Y-%m-%d %H:%M:%S')" || exit 0
        git push
        
    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: iptv-check-results
        path: |
          output/
          *.txt
          *.m3u
        retention-days: 30
