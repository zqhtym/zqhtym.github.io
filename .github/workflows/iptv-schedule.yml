name: IPTV Live Stream Detection

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # main.py: 每周一22:00 UTC运行 (周二6:00北京时间)
    - cron: '0 22 * * 1'
    # second.py: 每天17:00 UTC运行 (次日1:00北京时间)
    - cron: '0 17 * * *'
    # third.py: 每天4:00 UTC运行 (12:00北京时间)
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  run-main:
    name: Run Step1-Step5 (main.py)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' 
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        sudo apt-get install -y libgl1-mesa-glx-lts libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1 || sudo apt-get install -y libgl-mesa-glx libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1
        
    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Verify ffmpeg installation
      run: |
        echo "🔍 检查ffmpeg安装位置"
        which ffmpeg || echo "ffmpeg不在PATH中"
        ffmpeg -version || echo "ffmpeg版本检查失败"
        ls -la /usr/bin/ffmpeg || echo "/usr/bin/ffmpeg不存在"
        ls -la /usr/local/bin/ffmpeg || echo "/usr/local/bin/ffmpeg不存在"
        
    - name: Clean old CSV files
      run: |
        rm -f output1/*.csv || true
        
    - name: Run main.py (Step1-Step5)
      run: |
        # 优化GitHub Actions环境性能
        export GITHUB_ACTIONS=true
        ulimit -v 2097152
        ulimit -t 3600
        ulimit -m 1048576
        ulimit -s 8192
        
        export PYTHONOPTIMIZE=2
        export PYTHONHASHSEED=0
        export MALLOC_TRIM_THRESHOLD_=30000
        export PYTHONMALLOC=malloc
        
        python -c "import gc; gc.set_threshold(400, 4, 4); gc.collect()"
        
        python main.py
        
    - name: Upload Step1-5 results
      uses: actions/upload-artifact@v4
      with:
        name: step1-5-results
        path: output1/
        retention-days: 7
      if: always()
        
    - name: Commit CSV files to repository
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      run: |
        echo "🔍 检查output1目录内容"
        ls -la output1/ || echo "output1目录不存在"
        
        echo "🔍 检查CSV文件"
        find output1/ -name "*.csv" -type f || echo "未找到CSV文件"
        
        echo "🔧 配置Git"
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        echo "📦 添加CSV文件到Git"
        git add output1/*.csv || echo "添加CSV文件失败"
        
        echo "🔍 检查Git状态"
        git status
        
        echo "📝 提交更改"
        git diff --staged --quiet || git commit -m "Auto update CSV files - $(date '+%Y-%m-%d %H:%M:%S')"
        
        echo "🚀 推送到仓库"
        git push || echo "推送失败"

  run-second:
    name: Run Step6 (second.py)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request'
    needs: run-main
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        sudo apt-get install -y libgl1-mesa-glx-lts libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1 || sudo apt-get install -y libgl-mesa-glx libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1
        
    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Download Step5 results
      uses: actions/download-artifact@v4
      with:
        name: step1-5-results
        path: ./
      continue-on-error: true
        
    - name: Run second.py (Step6)
      run: |
        # 优化GitHub Actions环境性能
        export GITHUB_ACTIONS=true
        ulimit -v 2097152
        ulimit -t 3600
        ulimit -m 1048576
        ulimit -s 8192
        
        export PYTHONOPTIMIZE=2
        export PYTHONHASHSEED=0
        export MALLOC_TRIM_THRESHOLD_=30000
        export PYTHONMALLOC=malloc
        
        python -c "import gc; gc.set_threshold(400, 4, 4); gc.collect()"
        
        python second.py
        
    - name: Upload Step6 results
      uses: actions/upload-artifact@v4
      with:
        name: step6-results
        path: |
          step6_video_resources.csv
        retention-days: 7

  run-third:
    name: Run Step7-Step8 (third.py)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request'
    needs: run-second
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        sudo apt-get install -y libgl1-mesa-glx-lts libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1 || sudo apt-get install -y libgl-mesa-glx libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1
        
    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Download Step6 results
      uses: actions/download-artifact@v4
      with:
        name: step6-results
        path: output1/
      continue-on-error: true
        
    - name: Run third.py (Step7-Step8)
      run: |
        # 优化GitHub Actions环境性能
        export GITHUB_ACTIONS=true
        ulimit -v 2097152
        ulimit -t 3600
        ulimit -m 1048576
        ulimit -s 8192
        
        export PYTHONOPTIMIZE=2
        export PYTHONHASHSEED=0
        export MALLOC_TRIM_THRESHOLD_=30000
        export PYTHONMALLOC=malloc
        
        python -c "import gc; gc.set_threshold(400, 4, 4); gc.collect()"
        
        python third.py
        
    - name: Process output files
      run: |
        if [ -d "output" ]; then
          # 复制最新文件为标准文件名
          EXCELLENT_FILE=$(find output -name "LE.txt" | head -1)
          USEFUL_FILE=$(find output -name "LU.txt" | head -1)
          
          if [ -n "$EXCELLENT_FILE" ]; then
            cp "$EXCELLENT_FILE" LE.txt
          fi
          
          if [ -n "$USEFUL_FILE" ]; then
            cp "$USEFUL_FILE" LU.txt
          fi
        fi
        
    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add LE.txt LU.txt LE.m3u LU.m3u *.csv 2>/dev/null || true
        git commit -m "Auto update live stream list - $(date '+%Y-%m-%d %H:%M:%S')" || exit 0
        git push
        
    - name: Upload final results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: iptv-final-results
        path: |
          output/
          *.txt
          *.m3u
          *.csv
        retention-days: 30
