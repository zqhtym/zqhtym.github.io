[Settings]
# 源文件路径 | Source file path
source_file = resources.txt

# 输出目录 | Output directory  
output_dir = output

# 开启URL检测 | Enable URL checking
open_url_check = True

# 开启视频检测 | Enable video checking
open_video_check = True

# 开启速度测试 | Enable speed testing
open_speed_test = True

# URL检测超时时间(秒) | URL check timeout seconds
url_check_timeout = 5

# 视频检测超时时间(秒) | Video check timeout seconds
video_check_timeout = 180

# 速度测试超时时间(秒) | Speed test timeout seconds
speed_test_timeout = 10

# 并发检测数量 | Concurrent check count
max_concurrent = 10

# 批次处理大小 | Batch process size
batch_size = 50

# 内存使用阈值(%) | Memory usage threshold percentage
memory_threshold = 80

# 最小速度要求(bytes/s) | Minimum speed requirement bytes/s
min_speed = 204800

# 开启详细日志 | Enable verbose logging
verbose_logging = True

# 开启进度显示 | Enable progress display
show_progress = True

# 开启结果页面服务 | Enable result page service
open_service = False

# 服务端口 | Service port
service_port = 8080
